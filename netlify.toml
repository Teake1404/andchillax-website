# Netlify configuration for And Chillax
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# Pretty URLs — strip .html from URLs (so /about works as /about.html)
[build.processing.html]
  pretty_urls = true

# Cache headers — fast load times for returning visitors
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — protect site + visitors
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Allow Bookwhen iframe + Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://bookwhen.com https://*.bookwhen.com https://www.google.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com"

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
