# Netlify configuration for And Chillax
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "_site"

# Pretty URLs — strip .html from URLs (so /about works as /about.html)
[build.processing.html]
  pretty_urls = true

# Cache headers — fast load times for returning visitors
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — protect site + visitors
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Allow Bookwhen iframe + Google Fonts + Google Analytics 4
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://bookwhen.com https://*.bookwhen.com https://www.google.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com"

# CMS admin needs unsafe-eval (Decap uses eval internally) + GitHub API access
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' data: https:; img-src 'self' data: https: blob:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://api.github.com https://*.githubusercontent.com; frame-src 'self' https://api.netlify.com"
    X-Frame-Options = "SAMEORIGIN"

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
