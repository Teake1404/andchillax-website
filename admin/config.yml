# Decap CMS configuration for And Chillax
# Docs: https://decapcms.org/docs/configuration-options/

# Backend: GitHub OAuth via Netlify's free OAuth provider.
# Eva logs in at /admin with the "Sign in with GitHub" button.
# She must be a collaborator on the Teake1404/andchillax-website repo.
backend:
  name: github
  repo: Teake1404/andchillax-website
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Where uploaded images go (relative to repo root)
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Friendly admin UI labels
site_url: https://www.andchillax.co.uk
display_url: https://www.andchillax.co.uk
logo_url: /site_main_logo1.png
locale: en

# Editorial workflow — drafts go to a "Pull Request" before merging.
# Eva can write drafts, preview, and publish when ready.
publish_mode: editorial_workflow

# Content collections Eva can edit
collections:

  # =================================================================
  # BLOG POSTS — primary editing surface for Eva
  # =================================================================
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "blog/_posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "blog-post.njk"}
      - {label: "Permalink", name: "permalink", widget: "hidden", default: "/blog/{{slug}}/"}
      - {label: "Title", name: "title", widget: "string", hint: "The headline of the post — also becomes the page title shown in Google."}
      - {label: "URL slug", name: "slug", widget: "string", hint: "What appears in the URL (e.g. 'baby-choking' becomes /blog/baby-choking). Lowercase, hyphens, no spaces."}
      - {label: "Category", name: "category", widget: "select", options: ["First Aid", "Doula", "Newborn Safety", "Birth", "Childhood Illness"]}
      - {label: "Reading time (minutes)", name: "reading_time", widget: "number", default: 5, min: 1, max: 30}
      - {label: "Publish date", name: "date", widget: "datetime"}
      - {label: "Description (for Google search results)", name: "description", widget: "string", hint: "1-2 sentences shown in Google search results. Max 160 characters."}
      - {label: "Keywords (comma-separated)", name: "keywords", widget: "string", required: false, hint: "Optional. Helps Google understand the topic. e.g. 'baby choking, infant first aid'."}
      - {label: "Featured image (optional)", name: "image", widget: "image", required: false, hint: "Upload a photo to show at the top of the post and on the blog index card."}
      - {label: "Image alt text", name: "image_alt", widget: "string", required: false, hint: "Describe the image for accessibility and SEO. E.g. 'Hand demonstrating back-blow technique on infant manikin'."}
      - {label: "Short summary (for blog index card)", name: "excerpt", widget: "string", hint: "1-2 sentence preview shown on the blog index. Max 160 characters."}
      - {label: "Body", name: "body", widget: "markdown", hint: "Write your post here. Use ## for section headings, **bold** for emphasis."}
      - {label: "Related course CTA", name: "cta_course", widget: "select", required: false, default: "", options: ["", "12-Hour Paediatric Blended", "2-Hour Parent First Aid", "1-Day EFAW", "Doula Services"], hint: "Choose which course to recommend at the end of this post (drives bookings)."}
